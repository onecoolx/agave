<html>
<head><style>
#g { display:grid; width:400px; height:200px; }
#g div { }
</style></head>
<body>
<div id="g"><div id="a">A</div><div id="b">B</div><div id="c">C</div><div id="d">D</div></div>
<script>
var r=[];
function ck(n,a,e,t){t=t||2;r.push(n+':'+(Math.abs(a-e)<=t?'PASS':'FAIL('+a+'!='+e+')'));}
var g=document.getElementById('g');
var gx=g.offsetLeft, gy=g.offsetTop;
// 2x2 grid: cells 200x100 each
// a=[0,0], b=[0,1], c=[1,0], d=[1,1]
ck('a-x', document.getElementById('a').offsetLeft - gx, 0);
ck('a-y', document.getElementById('a').offsetTop - gy, 0);
ck('b-x', document.getElementById('b').offsetLeft - gx, 200);
ck('b-y', document.getElementById('b').offsetTop - gy, 0);
ck('c-x', document.getElementById('c').offsetLeft - gx, 0);
ck('c-y', document.getElementById('c').offsetTop - gy, 100);
ck('d-x', document.getElementById('d').offsetLeft - gx, 200);
ck('d-y', document.getElementById('d').offsetTop - gy, 100);
ck('a-w', document.getElementById('a').offsetWidth, 200);
ck('a-h', document.getElementById('a').offsetHeight, 100);
var ok=r.every(function(s){return s.indexOf('PASS')>=0;});
alert((ok?'ALL PASS':'FAILURES')+'|'+r.join('|'));
</script>
</body>
</html>
