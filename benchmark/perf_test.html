<html><body><div id="root"></div>
<script>
var R={};
function B(name,fn,n){var s=new Date().getTime();for(var i=0;i<n;i++)fn();R[name]=new Date().getTime()-s;}

// DOM creation
B("createElement_1k",function(){document.createElement("div");},1000);

// Property access
var div=document.createElement("div"); div.id="x";
B("getId_10k",function(){var x=div.id;},10000);

// appendChild + removeChild
var root=document.getElementById("root");
B("append_remove_500",function(){var e=document.createElement("span");root.appendChild(e);root.removeChild(e);},500);

// setAttribute
B("setAttribute_5k",function(){div.setAttribute("data-i","v");},5000);

// Style
B("style_set_5k",function(){div.style.color="blue";},5000);

// Pure JS: object creation
B("obj_create_10k",function(){var o={a:1,b:"x"};},10000);

// Pure JS: function call
function dummy(a,b){return a+b;}
B("func_call_100k",function(){dummy(1,2);},100000);

// Pure JS: array
B("array_push_10k",function(){var a=[];for(var j=0;j<100;j++)a.push(j);},10000);

// Pure JS: string concat
B("str_concat_10k",function(){var s="";for(var j=0;j<20;j++)s+="abc";},10000);

// Output
var out=[];for(var k in R)out.push(k+":"+R[k]+"ms");
alert("PERF:"+out.join("|"));
</script></body></html>
