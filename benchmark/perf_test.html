<html>
<head><title>Performance Benchmark</title></head>
<body>
<div id="root"></div>
<script>
var results = {};

function bench(name, fn, iterations) {
    var start = new Date().getTime();
    for (var i = 0; i < iterations; i++) fn();
    var elapsed = new Date().getTime() - start;
    results[name] = elapsed;
}

// DOM creation
bench('createElement_10000', function() {
    var el = document.createElement('div');
}, 10000);

// DOM tree manipulation
var root = document.getElementById('root');
bench('appendChild_1000', function() {
    var el = document.createElement('span');
    root.appendChild(el);
}, 1000);

// Property access
var div = document.createElement('div');
div.id = 'x';
bench('getAttribute_10000', function() {
    var x = div.id;
}, 10000);

// Style manipulation
bench('style_set_10000', function() {
    div.style.color = 'red';
}, 10000);

// String operations
bench('innerHTML_set_1000', function() {
    div.innerHTML = '<b>test</b>';
}, 1000);

// Object creation
bench('object_create_10000', function() {
    var o = { a: 1, b: 'x', c: true };
}, 10000);

// Function calls
function dummy(a, b) { return a + b; }
bench('function_call_100000', function() {
    dummy(1, 2);
}, 100000);

// Array operations
bench('array_push_10000', function() {
    var a = [];
    for (var j = 0; j < 100; j++) a.push(j);
}, 10000);

// Output
var out = [];
for (var k in results) out.push(k + ':' + results[k] + 'ms');
document.title = 'PERF:' + out.join('|');
alert('PERF:' + out.join('|'));
</script>
</body>
</html>
